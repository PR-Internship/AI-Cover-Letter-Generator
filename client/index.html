<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Analyzer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="container">
        <h1>AI-Powered Cover Letter Generator</h1>

        <div class="split-layout">
            <div class="card form-panel">
                <h2>Analyze Your Profile</h2>
                <form id="resume-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="name">Candidate Name</label>
                            <input type="text" id="name" name="name" placeholder="John Doe" required autocomplete="name">
                        </div>

                        <div class="form-group">
                            <label for="role">Job Role</label>
                            <input type="text" id="role" name="role" placeholder="Frontend Engineer" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="company">Target Company</label>
                        <input type="text" id="company" name="company" placeholder="e.g. Google, Stripe" required>
                    </div>

                    <div class="form-group">
                        <label for="skills">Key Skills</label>
                        <textarea id="skills" name="skills" rows="4" placeholder="e.g. JavaScript, Node.js, React, CSS Grid..." required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="resume">Upload Resume (PDF)</label>
                        <div class="file-upload-zone" id="upload-zone">
                            <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                            </svg>
                            <div class="upload-texts">
                                <span class="upload-text-main">Click to upload or drag & drop</span>
                                <span class="upload-text-sub">PDF format (Max. 5MB)</span>
                            </div>
                            <input type="file" id="resume" name="resume" accept=".pdf">
                            <div class="file-info-badge" id="file-info-badge" hidden>
                                <svg class="file-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                                </svg>
                                <span class="file-name" id="file-name-display">No file selected</span>
                            </div>
                        </div>
                    </div>

                    <button type="submit" id="submit-button">
                        <span class="btn-text">Generate Cover Letter</span>
                        <span class="btn-spinner" hidden></span>
                    </button>
                </form>
            </div>

            <div class="card result-panel">
                <div id="idle-state" class="panel-state-placeholder">
                    <svg class="placeholder-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                    <h3>Ready to Generate</h3>
                    <p>Enter your profile details and click generate. Your tailored AI cover letter will appear here.</p>
                </div>

                <div id="result" class="panel-state-result" hidden>
                    <div id="output" class="output-content"></div>
                    <button id="copy-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" class="copy-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="20" height="20">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                        </svg>
                        <span id="copy-btn-text">Copy to Clipboard</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="service.js"></script>
</body>

</html>
